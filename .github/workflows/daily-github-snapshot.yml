name: Daily GitHub profile snapshot

on:
  push:
    paths:
      - ".github/workflows/daily-github-snapshot.yml"
      - "scripts/update-daily-github-snapshot.sh"
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-github-profile-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Generate today's public profile snapshot
        env:
          GITHUB_PROFILE_USER: Yukibei
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update-daily-github-snapshot.sh

      - name: Commit the snapshot
        run: |
          if [[ -z "$(git status --porcelain -- data/github-daily.json)" ]]; then
            echo "Snapshot is already current."
            exit 0
          fi

          git config user.name "Yukibei"
          git config user.email "165859471+Yukibei@users.noreply.github.com"
          git add -- data/github-daily.json
          git commit -m "chore: update daily GitHub snapshot"
          git push
